<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaNav</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        position: relative;
        background-image: url("Aquanav2.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        margin: 0;
        padding-top: 70px;
        animation: fadeIn 1.5s ease-in-out;
        z-index: 1; /* Ensures it's above the pseudo-element */
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(170, 170, 170, 0.4);
        z-index: 0; /* Under the body content */
      }

      /* Fade-in Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Navbar Animation */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        transform: translateY(-100%);
        animation: slideDown 0.8s ease-out forwards;
      }
      /* slide down animation */

      @keyframes slideDown {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(0);
        }
      }

      .welcome-text {
        animation: slideDown 0.8s ease-out forwards;
      }
      /*
      @keyframes bounceIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      } */

      /* Button Hover Effect */
      .btn-dark {
        transition: transform 0.3s ease-in-out;
      }

      .btn-dark:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body class="d-flex flex-column justify-content-center align-items-center">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="#">AquaNav</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-primary" href="{{url_for('sign_up')}}"
                >Register</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-primary" href="{{url_for('login')}}"
                >Login</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="text-center mt-5">
      <h1 class="fw-bold text-black welcome-text" style="font-size: 4rem">
        Welcome To
      </h1>
      <h2 class="fw-bold text-primary welcome-text" style="font-size: 3rem">
        AquaNav
      </h2>
      <button
        class="btn btn-dark mt-3"
        onclick="window.location.href='{{ url_for('sign_up') }}'"
      >
        Let's Get Started
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
