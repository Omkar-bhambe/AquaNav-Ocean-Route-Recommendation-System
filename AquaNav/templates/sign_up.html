<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaNav - Register</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #0077be, #00a8cc);
        padding-top: 80px;
        min-height: 100vh;
        color: #333;
        display: flex;
        flex-direction: column;
      }

      .form-container {
        background: #ffffffee;
        padding: 40px 30px;
        border-radius: 15px;
        width: 100%;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
      }

      h2 {
        text-align: center;
        color: #0077be;
        font-weight: 700;
        margin-bottom: 30px;
      }

      label {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .form-control {
        border-radius: 8px;
        padding: 10px;
        font-size: 1rem;
        margin-bottom: 20px;
      }

      .btn-primary {
        background-color: #0077be;
        border: none;
        font-weight: bold;
      }

      .btn-primary:hover {
        background-color: #005f95;
      }

      .navbar {
        background-color: #ffffffcc !important;
        backdrop-filter: blur(6px);
      }

      .navbar-brand {
        font-size: 1.5rem;
        color: #0077be !important;
        font-weight: bold;
      }

      .nav-link {
        color: #0077be !important;
        font-weight: 600;
      }

      .nav-link:hover {
        color: #005f95 !important;
      }

      @media (max-width: 768px) {
        .form-container {
          padding: 25px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">AquaNav</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('sign_up')}}">Register</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('login')}}">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Registration Form -->
    <main class="d-flex flex-grow-1 align-items-center">
      <div class="form-container">
        <h2>Create Your Account</h2>
        <form method="POST">
          <div class="mb-3">
            <label for="username">Name</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>
          <div class="mb-4">
            <label for="confirm">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              id="confirm"
              name="confirm"
              placeholder="Re-enter your password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">
            Register
          </button>
          <div class="text-end">
            <a href="{{url_for('login')}}" class="text-decoration-none text-primary"
              >Already registered?</a
            >
          </div>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
