<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Route Map - AquaNav</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 9999;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .top-bar a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="{{ url_for('ship_route') }}">← Back to Dashboard</a>
    </div>

    <div id="map">
        {% include 'map.html' ignore missing %}
    </div>

</body>
</html>
