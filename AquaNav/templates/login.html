<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaNav</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #0077be, #00a8cc);
        padding-top: 60px;
        min-height: 100vh;
        color: #333;
      }

      .container {
        background: #ffffffee;
        padding: 40px;
        border-radius: 15px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
      }

      h2 {
        text-align: center;
        color: #0077be;
        font-weight: 700;
        margin-bottom: 30px;
      }

      label {
        font-weight: 600;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 8px 0 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
      }

      button {
        background-color: #0077be;
        color: white;
        font-weight: bold;
        transition: background-color 0.3s ease-in-out;
      }

      button:hover {
        background-color: #005f95;
      }

      .navbar {
        background-color: #ffffffcc !important;
        backdrop-filter: blur(6px);
      }

      .navbar-brand {
        font-size: 1.5rem;
        color: #0077be !important;
        font-weight: bold;
      }

      .nav-link {
        color: #0077be !important;
        font-weight: 600;
      }

      .nav-link:hover {
        color: #005f95 !important;
      }

      .flash-alert {
        position: fixed;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1050;
        min-width: 300px;
        text-align: center;
        opacity: 1;
        transition: opacity 1s ease-out;
      }

      @media (max-width: 768px) {
        .container {
          padding: 25px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="#">AquaNav</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('sign_up') }}">Register</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('login') }}">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Flash Message -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} flash-alert animate__animated animate__fadeInDown" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <div class="container mt-5">
      <form action="{{ url_for('login') }}" method="post" autocomplete="off">
        <h2>Captain Login</h2>

        <input
          type="email"
          name="username"
          class="form-control"
          placeholder="Enter Email"
          autocomplete="off"
          required
        />
        <input
          type="password"
          name="password"
          class="form-control"
          placeholder="Enter Password"
          autocomplete="off"
          required
        />
        <button type="submit">Set Sail</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Fade out flash messages after 3.5 seconds
      setTimeout(() => {
        const alerts = document.querySelectorAll('.flash-alert');
        alerts.forEach(alert => {
          alert.style.opacity = '0';
          setTimeout(() => alert.remove(), 1000);
        });
      }, 3500);
    </script>
  </body>
</html>
